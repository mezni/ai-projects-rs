[project]
name = "ai_agent"
version = "0.1.0"
description = "Autonomous AI Agent built with uv, ruff, and pytest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=3.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

# Dependency groups managed via uv
[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]
