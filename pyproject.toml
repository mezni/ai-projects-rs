[project]
name = "telecom-rag"
version = "0.1.0"
description = "Production-style RAG over telecom policy documents, built step by step."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.20.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=5.0.1",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (make db-up)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
